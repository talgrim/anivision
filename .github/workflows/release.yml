name: Release

# On every push to main release-please keeps a release PR up to date (version bump + changelog,
# from Conventional Commits). Merging that PR creates the tag, then the signed APK is built and
# published to https://wip.talgrim.dev. Secrets are only available here, never on pull requests.
on:
  push:
    branches: [main]
  # re-run the build and publish for a tag that already exists (e.g. after a failed run)
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, e.g. v1.2.0
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # without this the release PR goes to the repo's default branch (develop)
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # the tag to build: the one release-please just created, or the one given by hand
  plan:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      version: ${{ steps.p.outputs.version }}
    steps:
      - id: p
        env:
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${RP_TAG:-$INPUT_TAG}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  apk:
    needs: plan
    # !cancelled(): a skipped release-please (manual run) would otherwise skip this job too
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      # the runner already has the SDK; this only accepts the licenses (the default 'tools' package no longer exists)
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: src/android
        run: ./gradlew test
      - name: Write the signing config
        working-directory: src/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          [ -s release.jks ] || { echo "keystore secret is empty" >&2; exit 1; }
          keytool -list -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Build the signed APK
        working-directory: src/android
        run: ./gradlew assembleRelease
      - name: Check the APK is signed
        run: |
          apk=src/android/app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "no signed APK (unsigned builds are named app-release-unsigned.apk)" >&2; ls src/android/app/build/outputs/apk/release; exit 1; }
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify "$apk"
      - uses: talgrim/fly-volume-publish@v1
        with:
          file: src/android/app/build/outputs/apk/release/app-release.apk
          product: anivision
          version: ${{ needs.plan.outputs.version }}
          suffix: .apk
          fly-app: wip-talgrim
          base-url: https://wip.talgrim.dev
          fly-api-token: ${{ secrets.WIP_FLY_API_TOKEN }}
